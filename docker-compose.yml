version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kubepolls
      POSTGRES_USER: kubepolls
      POSTGRES_PASSWORD: kubepolls
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubepolls"]
      interval: 5s
      timeout: 5s
      retries: 5

  kubePolls:
    build:
      context: django
      dockerfile: Dockerfile
    image: mahar628/kubepolls:latest
    environment:
      DB_NAME: kubepolls
      DB_USER: kubepolls
      DB_PASSWORD: kubepolls
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./django:/app
      - ./static:/app/static
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
