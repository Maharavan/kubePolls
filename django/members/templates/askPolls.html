<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubePolls — Create Poll</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        function addChoice() {
            const container = document.getElementById('choices-container');
            const count = container.querySelectorAll('.choice-container').length;
            if (count >= 5) {
                alert('Maximum 5 choices allowed.');
                return;
            }
            const div = document.createElement('div');
            div.classList.add('choice-container', 'fade-in');
            div.innerHTML = `
                <input type="text" name="choice${count + 1}" placeholder="Choice ${count + 1}" required />
                <button type="button" class="remove-btn" onclick="removeChoice(this)" title="Remove choice">
                    <i class="fas fa-trash-alt"></i>
                </button>
            `;
            container.appendChild(div);
        }

        function removeChoice(btn) {
            const item = btn.closest('.choice-container');
            item.classList.add('fade-out');
            setTimeout(() => item.remove(), 280);
        }
    </script>
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-btn" onclick="history.back()" title="Go back"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="history.forward()" title="Go forward"><i class="fa-solid fa-arrow-right"></i></button>
        <a href="/" class="nav-btn" title="Home"><i class="fa-solid fa-house"></i></a>
    </nav>

    <h1>KubePolls</h1>
    <p>Fill in your question and choices below</p>

    <form action="{% url 'poll-list' %}" method="POST" class="form-container">
        {% csrf_token %}

        <div style="width:100%;">
            <label for="set_question">Question</label>
            <input id="set_question" type="text" name="name_field"
                   placeholder="e.g. What's your favourite language?" required />
        </div>

        <div class="choice-group" id="choices-container">
            <label>Choices</label>
            <div class="choice-container">
                <input type="text" name="choice1" placeholder="Choice 1" required />
                <button type="button" class="remove-btn invisible" title="Remove choice">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div class="choice-container">
                <input type="text" name="choice2" placeholder="Choice 2" required />
                <button type="button" class="remove-btn invisible" title="Remove choice">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>

        <button type="button" class="add-choice-btn" onclick="addChoice()">
            <i class="fas fa-plus-circle"></i> Add Choice
        </button>

        <button type="submit">
            <i class="fas fa-paper-plane"></i> Create Poll
        </button>
    </form>
</body>
</html>
