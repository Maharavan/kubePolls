<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubePolls — All Polls</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-btn" onclick="history.back()" title="Go back"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="history.forward()" title="Go forward"><i class="fa-solid fa-arrow-right"></i></button>
        <a href="/" class="nav-btn" title="Home"><i class="fa-solid fa-house"></i></a>
    </nav>

    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             style="display:inline-block;vertical-align:middle;margin-right:8px;margin-bottom:4px;">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            <path d="M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
            <circle cx="12" cy="12" r="8" stroke-dasharray="4 2"/>
        </svg>KubePolls
    </h1>
    <p>Select a poll to cast your vote</p>

    {% if questions %}
        <div class="form-question">
            <div class="question-list">
                {% for question in questions %}
                    <div class="question-card">
                        <a href="/live-polls/?id={{ question.id }}&text={{ question.question|urlencode }}">
                            <label class="question-text">{{ question.question }}</label>
                        </a>
                        <div class="card-footer">
                            <span class="date">
                                <i class="fa-regular fa-calendar" style="margin-right:4px;"></i>
                                {{ question.date }}
                            </span>
                            <a href="/poll-results/?question_id={{ question.id }}" class="result-button">
                                <i class="fa-solid fa-chart-simple" style="margin-right:5px;"></i>Results
                            </a>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    {% else %}
        <p>No polls available yet. <a href="/create-polls/" style="color:#00d4ff;">Create the first one!</a></p>
    {% endif %}
</body>
</html>
