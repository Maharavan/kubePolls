<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubePolls</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav class="nav-bar">
        <button class="nav-btn" onclick="history.back()" title="Go back"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="nav-btn" onclick="history.forward()" title="Go forward"><i class="fa-solid fa-arrow-right"></i></button>
        <a href="/" class="nav-btn" title="Home"><i class="fa-solid fa-house"></i></a>
    </nav>

    <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
             style="display:inline-block;vertical-align:middle;margin-right:8px;margin-bottom:4px;">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            <path d="M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
            <circle cx="12" cy="12" r="8" stroke-dasharray="4 2"/>
        </svg>KubePolls
    </h1>
    <p>Real-time polling, built for the cloud</p>

    <div class="btn-group">
        <a href="/create-polls/">
            <button class="poll-btn">
                <i class="fa-solid fa-circle-plus"></i> Create a Poll
            </button>
        </a>
        <a href="/poll-list/">
            <button class="poll-btn">
                <i class="fa-solid fa-chart-bar"></i> View Polls
            </button>
        </a>
    </div>
</body>
</html>
